<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>My Wallet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%BE%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />

<div class="app">
  <header class="brand">
    <div>
      <h1 class="serif">My Wallet</h1>
      <div class="tagline">a personal expense ledger</div>
    </div>
  </header>

  <aside class="sidebar">
    <nav class="card month-nav" aria-label="Month">
      <button type="button" id="prevMonth" aria-label="Previous month">‹</button>
      <div>
        <span class="label" id="monthLabel"></span>
        <button type="button" class="today-btn" id="gotoToday">today</button>
      </div>
      <button type="button" id="nextMonth" aria-label="Next month">›</button>
    </nav>

    <div class="card stat-tile">
      <div class="eyebrow">Spent this month</div>
      <div class="hero serif" id="monthTotal">GH₵0.00</div>
      <div class="sub" id="monthSub">no expenses logged yet</div>
    </div>

    <div class="stat-row">
      <div class="card mini-tile">
        <div class="eyebrow">Transactions</div>
        <div class="val" id="txnCount">0</div>
      </div>
      <div class="card mini-tile">
        <div class="eyebrow">Daily avg</div>
        <div class="val" id="dailyAvg">GH₵0</div>
      </div>
    </div>

    <div class="card budget-tile">
      <div class="budget-head">
        <div class="eyebrow">Monthly budget</div>
        <button type="button" class="budget-edit-btn" id="editBudgetBtn">edit</button>
      </div>
      <div id="budgetDisplay">
        <div class="budget-status-line">
          <span class="status-dot good" id="budgetDot"></span>
          <span class="amt" id="budgetAmt">Not set</span>
          <span class="label" id="budgetLabel"></span>
        </div>
        <div class="budget-bar-track"><div class="budget-bar-fill good" id="budgetFill"></div></div>
      </div>
      <form id="budgetForm" class="budget-set-form is-hidden">
        <input type="number" id="budgetInput" min="0" max="100000000" step="1" placeholder="e.g. 1200" inputmode="decimal" />
        <button type="submit" class="btn-primary">Save</button>
      </form>
    </div>

    <div class="card breakdown">
      <div class="eyebrow">By category</div>
      <div id="breakdownList"></div>
    </div>

    <button type="button" class="ghost-btn" id="exportBtn">Export CSV</button>
  </aside>

  <main class="main">
    <form class="card form-card" id="expenseForm">
      <div class="form-title">
        <span id="formTitle">Add an expense</span>
        <span class="edit-flag is-hidden" id="editFlag">editing existing entry</span>
      </div>
      <div class="form-grid">
        <div class="field amount-field">
          <label for="amountInput">Amount</label>
          <span class="prefix">GH₵</span>
          <input type="number" id="amountInput" min="0" max="100000000" step="0.01" placeholder="0.00" inputmode="decimal" required />
        </div>
        <div class="field">
          <label for="descInput">Description</label>
          <input type="text" id="descInput" placeholder="e.g. Groceries at Melcom" required maxlength="80" />
        </div>
        <div class="field">
          <label for="categoryInput">Category</label>
          <select id="categoryInput"></select>
        </div>
        <div class="field">
          <label for="dateInput">Date</label>
          <input type="date" id="dateInput" min="2000-01-01" max="2100-12-31" required />
        </div>
        <div class="field form-actions">
          <button type="submit" class="btn-primary" id="submitBtn">Add</button>
          <button type="button" class="btn-secondary is-hidden" id="cancelEditBtn">Cancel</button>
        </div>
      </div>
    </form>

    <div class="filter-row" id="filterRow"></div>

    <div class="card ledger-card">
      <div class="ledger-scroll">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Description</th>
              <th>Category</th>
              <th class="num">Amount</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="ledgerBody"></tbody>
        </table>
      </div>
      <div class="empty-state is-hidden" id="emptyState">
        <div class="glyph">🧾</div>
        <div class="lead">No expenses here yet</div>
        <div>Add your first one using the form above.</div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toastMsg"></span>
  <button type="button" id="toastUndo" class="is-hidden">Undo</button>
</div>

<script src="script.js"></script>
